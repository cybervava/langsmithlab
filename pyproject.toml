[project]
name = "langsmithlab"
version = "0.1.0"
description = "LangChain v1 middleware agents (summarization, human-in-the-loop) traced with LangSmith"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.4",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.14",
    "langsmith>=0.14.7",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langsmithlab = "langsmithlab.demo:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.33",
    "pytest>=9.1.1",
]
